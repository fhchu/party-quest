# The game on the Lightsail instance. deploy/up.sh copies this file to the
# server and writes .env there: DOMAIN from deploy/build.env, VERSION (the
# image tag) and the secrets.
name: party-quest

# Every service's logs, capped so they don't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  game:
    image: ghcr.io/fhchu/party-quest:${VERSION:?set VERSION in .env}
    restart: unless-stopped
    # No play without a working backend.
    depends_on:
      backend:
        condition: service_healthy
    command:
      - -domain=${DOMAIN:?set DOMAIN in .env}
      - -origin=https://${DOMAIN}
      - -acme-cache=/data/acme
    # The right-hand ports are deploy/entrypoint.sh's.
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
      - "443:8443/udp"
    volumes:
      # Let's Encrypt allows only a few new certificates a week per name, so
      # the certificate must survive redeploys.
      - acme:/data/acme
    logging: *logging

  backend:
    # Reached only on the Compose network, as
    # http://backend:8080 (its default ADDR, in
    # backend/internal/config/config.go); it publishes no ports.
    image: ghcr.io/fhchu/party-quest-backend:${VERSION:?set VERSION in .env}
    restart: unless-stopped
    # deploy/backend.Dockerfile makes /data and /tmp writable for the
    # backend's user.
    environment:
      DATABASE_PATH: /data/game.db
      GAME_SERVER_TOKEN: ${GAME_SERVER_TOKEN:?set GAME_SERVER_TOKEN in .env}
      # In the container's own files, which a restart keeps and a deploy's
      # new container doesn't (backend/cmd/api/health.go).
      START_MARKER: /tmp/backend-started
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "-healthcheck"]
      # timeout must stay above healthcheckTimeout in
      # backend/cmd/api/health.go; check.sh checks it.
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

  alloy:
    # Ships every container's logs to Grafana Cloud (deploy/alloy/config.alloy).
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_LOGS_URL: ${GRAFANA_LOGS_URL:?set GRAFANA_LOGS_URL in .env}
      GRAFANA_LOGS_USER: ${GRAFANA_LOGS_USER:?set GRAFANA_LOGS_USER in .env}
      GRAFANA_LOGS_TOKEN: ${GRAFANA_LOGS_TOKEN:?set GRAFANA_LOGS_TOKEN in .env}
    volumes:
      # Alloy finds the containers and reads their logs through Docker (the
      # socket path in deploy/alloy/config.alloy). Even read-only, the socket
      # gives root on the instance.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Where each log was read up to, so a restart doesn't resend them.
      - alloy-data:/var/lib/alloy/data
    logging: *logging

volumes:
  acme:
  # The backend's SQLite files. Lightsail's daily snapshots back them up.
  backend-data:
  alloy-data:
