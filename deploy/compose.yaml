# The game on the Lightsail instance. deploy/up.sh copies this file and
# domain.env to the server and writes .env there: DOMAIN from domain.env,
# VERSION (the image tag) and the secrets.
name: party-quest
services:
  game:
    # Must match the image name in deploy/deploy.sh and
    # .github/workflows/release.yml.
    image: ghcr.io/fhchu/party-quest:${VERSION:?set VERSION in .env}
    restart: unless-stopped
    # No play without a working backend.
    depends_on:
      backend:
        condition: service_healthy
    command:
      - -domain=${DOMAIN:?set DOMAIN in domain.env}
      - -origin=https://${DOMAIN}
      - -acme-cache=/data/acme
    # The right-hand ports are deploy/entrypoint.sh's.
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
      - "443:8443/udp"
    volumes:
      # Let's Encrypt allows only a few new certificates a week per name, so
      # the certificate must survive redeploys.
      - acme:/data/acme
    logging:
      driver: json-file
      # Untuned; keeps logs from filling the disk.
      options:
        max-size: 10m
        max-file: "3"

  backend:
    # Must match the image name in deploy/deploy.sh and
    # .github/workflows/release.yml. Reached only on the Compose network, as
    # http://backend:8080 (its default ADDR, in
    # server/internal/config/config.go); it publishes no ports.
    image: ghcr.io/fhchu/party-quest-backend:${VERSION:?set VERSION in .env}
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/game.db
      GAME_SERVER_TOKEN: ${GAME_SERVER_TOKEN:?set GAME_SERVER_TOKEN in .env}
      # In the container's own files, which a restart keeps and a deploy's
      # new container doesn't (server/cmd/api/health.go).
      START_MARKER: /tmp/backend-started
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "-healthcheck"]
      # Untuned. timeout must stay above healthcheckTimeout in
      # server/cmd/api/health.go.
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      # Untuned, as for the game.
      options:
        max-size: 10m
        max-file: "3"

  alloy:
    # Ships every container's logs to Grafana Cloud (deploy/alloy/config.alloy).
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_LOGS_URL: ${GRAFANA_LOGS_URL:?set GRAFANA_LOGS_URL in .env}
      GRAFANA_LOGS_USER: ${GRAFANA_LOGS_USER:?set GRAFANA_LOGS_USER in .env}
      GRAFANA_LOGS_TOKEN: ${GRAFANA_LOGS_TOKEN:?set GRAFANA_LOGS_TOKEN in .env}
    volumes:
      # Alloy finds the containers and reads their logs through Docker. Even
      # read-only, the socket gives root on the instance.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Where each log was read up to, so a restart doesn't resend them.
      - alloy-data:/var/lib/alloy/data
    logging:
      driver: json-file
      # Untuned, as for the game.
      options:
        max-size: 10m
        max-file: "3"

volumes:
  acme:
  # The backend's SQLite files. Lightsail's daily snapshots back them up.
  backend-data:
  alloy-data:
