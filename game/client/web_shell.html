<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
	position: fixed;
	top: 0;
	left: 0;
	transform-origin: 0 0;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// Party Quest: a phone or tablet held sideways in a portrait page (portrait
// lock on, or Safari, which can't lock orientation) shows the game a
// quarter turn clockwise, for the device held with its top to the left.
// The canvas resize policy is None, so this page sizes the canvas; Godot
// reads its size every frame. Godot places presses as if the canvas weren't
// turned; deploy/export-web.sh patches the engine to ask pqRotatedPosition
// instead while pqRotated is set (check.sh checks the names agree).
window.pqRotated = false;

// Where a press at the page position in evt lands on the turned canvas, in
// canvas pixels; the undo of the turn in fitCanvas. rect is the canvas's
// on-screen box: the page's top edge is the canvas's left, and the page's
// right edge is the canvas's top.
window.pqRotatedPosition = function (evt, rect, canvas) {
	return [
		(evt.clientY - rect.y) * canvas.width / rect.height,
		(rect.x + rect.width - evt.clientX) * canvas.height / rect.width,
	];
};
(function () {
	const canvas = document.getElementById('canvas');
	// A mouse is never coarse, so a PC never turns.
	const rotatedQuery = matchMedia('(orientation: portrait) and (pointer: coarse)');

	function fitCanvas() {
		const rotated = rotatedQuery.matches;
		const width = rotated ? window.innerHeight : window.innerWidth;
		const height = rotated ? window.innerWidth : window.innerHeight;
		const ratio = window.devicePixelRatio || 1;
		canvas.style.width = `${width}px`;
		canvas.style.height = `${height}px`;
		canvas.width = Math.floor(width * ratio);
		canvas.height = Math.floor(height * ratio);
		// Turned about the top-left corner, then moved back onto the page.
		// pqRotatedPosition undoes this for presses.
		canvas.style.transform = rotated
			? `translateX(${window.innerWidth}px) rotate(90deg)` : '';
		window.pqRotated = rotated;
	}

	fitCanvas();
	window.addEventListener('resize', fitCanvas);
	rotatedQuery.addEventListener('change', fitCanvas);

	// Phones and tablets only. Browsers allow fullscreen only from a press.
	// iPhone Safari has no fullscreen for pages, so there this does nothing.
	if (matchMedia('(pointer: coarse)').matches) {
		canvas.addEventListener('pointerdown', function () {
			const root = document.documentElement;
			const request = root.requestFullscreen || root.webkitRequestFullscreen;
			if (request && !document.fullscreenElement && !document.webkitFullscreenElement) {
				const done = request.call(root);
				if (done) {
					done.catch(function (err) {
						console.error('Fullscreen refused:', err);
					});
				}
			}
		}, { once: true });
	}
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
