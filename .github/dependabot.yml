# Weekly update PRs for what Dependabot can read: Go modules, GitHub Actions
# and Docker images. One grouped PR per ecosystem a week. What it can't read
# (Godot, GdUnit4, the tools check.yml downloads) is checked at the same time
# by .github/workflows/versions.yml.
version: 2
updates:
  - package-ecosystem: gomod
    directories: [/server, /relay]
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    groups:
      go:
        patterns: ["*"]
    ignore:
      # webtransport-go builds against one quic-go version, so a newer
      # quic-go alone breaks the relay. Updating webtransport-go moves
      # quic-go to the version it needs.
      - dependency-name: github.com/quic-go/quic-go
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    groups:
      compose:
        patterns: ["*"]
