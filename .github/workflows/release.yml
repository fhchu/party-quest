# For a version tag (v0.1.1): builds the game image, pushes it to GitHub's
# container registry as ghcr.io/<owner>/<repo>:<tag>, and deploys it. Run by
# hand with a tag, it only deploys that tag's image: how to roll back.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An already built version to deploy, for example v0.1.1
        required: true

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Must match GODOT_VERSION in check.yml and the Dockerfile's ARG.
  GODOT_VERSION: 4.7.2

jobs:
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Pushing to ghcr.io with the workflow's own token.
      packages: write
    # Untuned. The web export's brotli pass takes about a minute and the
    # first run downloads the export templates.
    timeout-minutes: 20
    steps:
      # The trigger is any v*, which also matches typos like v.0.1.2.
      - name: Require a version like v1.2.3
        run: |
          set -euo pipefail
          [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "$GITHUB_REF_NAME is not a version like v1.2.3; delete the tag and its release, then tag again." >&2
            exit 1
          }

      - uses: actions/checkout@v7
        with:
          # The next step needs main's history to compare against.
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "$GITHUB_REF_NAME is not on main; tag a commit that is." >&2
            exit 1
          }

      - name: Cache the web export template
        id: templates
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-web-template-${{ env.GODOT_VERSION }}

      - name: Install Godot and the web export template
        run: |
          set -euo pipefail
          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          tmp="$(mktemp -d)"
          cd "$tmp"
          curl -fsSL -o godot.zip "$release/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mkdir -p "$HOME/.local/bin"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          if [ "${{ steps.templates.outputs.cache-hit }}" != "true" ]; then
            # The archive holds every platform (over 1 GB); the web preset
            # (game/export_presets.cfg: no threads, no extensions) needs one.
            curl -fsSL -o templates.tpz "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
            mkdir -p "$dest"
            unzip -j -d "$dest" templates.tpz \
              templates/version.txt templates/web_nothreads_release.zip
          fi

      - name: Install brotli
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends brotli

      - name: Export the web build
        run: |
          set -euo pipefail
          # A fresh checkout has no import cache, and the export needs it.
          godot --headless --path game --import
          deploy/export-web.sh

      - name: Build and push the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # The label links the package to this repository.
          docker build --platform linux/amd64 -f deploy/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    needs: image
    # Runs when the image job was built for a tag, or skipped by a manual run.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Let SSH reach the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          # The server's public host key, so SSH checks who it is talking to.
          echo "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts

      - name: Start the version on the server
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
        run: deploy/up.sh "$DEPLOY_TARGET" "$VERSION"

      - name: Check the site answers
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . deploy/domain.env
          # The page is served brotli-compressed only.
          curl --fail --silent --show-error --retry 6 --retry-delay 5 \
            --retry-all-errors -H 'Accept-Encoding: br' -o /dev/null \
            "https://$DOMAIN/"
