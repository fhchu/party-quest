# For a version tag (v0.1.1): builds the game and backend images, pushes
# them to GitHub's container registry as ghcr.io/<owner>/<repo>:<tag> and
# ghcr.io/<owner>/<repo>-backend:<tag>, and deploys them. Run by
# hand with a tag, it only deploys that tag's images: how to roll back.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An already built version to deploy, for example v0.1.1
        required: true

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Must match GODOT_VERSION in check.yml and the Dockerfile's ARG.
  GODOT_VERSION: 4.7.2

jobs:
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Pushing to ghcr.io with the workflow's own token.
      packages: write
      # Reading the tagged commit's check run.
      actions: read
    # Must stay above .github/wait-for-check.sh's wait plus a build;
    # check.sh checks it. Untuned.
    timeout-minutes: 30
    steps:
      # The trigger is any v*, which also matches typos like v.0.1.2.
      - name: Require a version like v1.2.3
        run: |
          set -euo pipefail
          [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "$GITHUB_REF_NAME is not a version like v1.2.3; delete the tag and its release, then tag again." >&2
            exit 1
          }

      - uses: actions/checkout@v7
        with:
          # The next step needs main's history to compare against.
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "$GITHUB_REF_NAME is not on main; tag a commit that is." >&2
            exit 1
          }

      - name: Require the tagged commit's check run to have passed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: .github/wait-for-check.sh

      - name: Install Godot and uv
        env:
          UV_VERSION: 0.13.9
        run: |
          set -euo pipefail
          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          tmp="$(mktemp -d)"
          cd "$tmp"
          curl -fsSL -o godot.zip "$release/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mkdir -p "$HOME/.local/bin"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
          # deploy/web-template/build.sh fetches its Python with uv.
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" \
            | env UV_INSTALL_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Rebuilt only when the Godot version or what the build reads changes.
      - name: Cache the trimmed web template
        id: template
        uses: actions/cache@v6
        with:
          path: deploy/web-template/out
          key: web-template-${{ env.GODOT_VERSION }}-${{ hashFiles('deploy/web-template/build.sh', 'deploy/web-template/custom.py', 'deploy/web-template/*.gdbuild') }}

      - name: Build the trimmed web template
        if: steps.template.outputs.cache-hit != 'true'
        run: deploy/web-template/build.sh

      # Installed under the stock template's name, so the Web preset needs no
      # custom path and the stock template is never downloaded.
      - name: Install the trimmed web template
        run: |
          set -euo pipefail
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          echo "${GODOT_VERSION}.stable" > "$dest/version.txt"
          cp deploy/web-template/out/godot.web.template_release.wasm32.nothreads.zip \
            "$dest/web_nothreads_release.zip"

      - name: Install brotli
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends brotli

      - name: Export the web build
        run: |
          set -euo pipefail
          # A fresh checkout has no import cache, and the export needs it.
          godot --headless --path game --import
          deploy/export-web.sh

      - name: Build and push the images
        env:
          # Must match the image names in deploy/compose.yaml.
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend:${{ github.ref_name }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # The label links each package to this repository.
          source_label="org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          docker build --platform linux/amd64 -f deploy/Dockerfile \
            --label "$source_label" -t "$IMAGE" .
          docker build --platform linux/amd64 -f deploy/backend.Dockerfile \
            --label "$source_label" -t "$BACKEND_IMAGE" .
          docker push "$IMAGE"
          docker push "$BACKEND_IMAGE"

  deploy:
    needs: image
    # Runs when the image job was built for a tag, or skipped by a manual run.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Let SSH reach the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          # The server's public host key, so SSH checks who it is talking to.
          echo "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts

      - name: Start the version on the server
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
          # The secrets deploy/up.sh sends to the server.
          GAME_SERVER_TOKEN: ${{ secrets.GAME_SERVER_TOKEN }}
          GRAFANA_LOGS_URL: ${{ secrets.GRAFANA_LOGS_URL }}
          GRAFANA_LOGS_USER: ${{ secrets.GRAFANA_LOGS_USER }}
          GRAFANA_LOGS_TOKEN: ${{ secrets.GRAFANA_LOGS_TOKEN }}
        run: deploy/up.sh "$DEPLOY_TARGET" "$VERSION"

      - name: Check the site answers
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . deploy/domain.env
          # The page is served brotli-compressed only.
          curl --fail --silent --show-error --retry 6 --retry-delay 5 \
            --retry-all-errors -H 'Accept-Encoding: br' -o /dev/null \
            "https://$DOMAIN/"

      # The rules in the repo are the record (deploy/grafana/alerts.json).
      - name: Push the alert rules to Grafana
        env:
          GRAFANA_URL: ${{ vars.GRAFANA_URL }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          GRAFANA_API_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}
        run: deploy/grafana/push-alerts.sh
